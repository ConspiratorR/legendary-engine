[package]
name = "engine-physics"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
engine-math = { path = "../engine-math" }
# No audio: wasm-friendly; feature-off array authority still available.
engine-core = { path = "../engine-core", default-features = false }
engine-ecs = { path = "../engine-ecs" }
thiserror = "2"
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.10"

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "physics_benchmarks"
harness = false
