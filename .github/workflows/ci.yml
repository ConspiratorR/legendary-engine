name: RustEngine CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --all -- -D warnings

  build-and-test:
    name: Build & Test (${{ matrix.os }})
    needs: [fmt, clippy]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libudev-dev libasound2-dev

      - name: Build
        run: cargo build --all

      - name: Test
        run: cargo test --all --no-fail-fast

      - name: Run example (headless)
        if: runner.os != 'Windows'
        run: |
          cargo run --example basic -p engine-core --timeout 10s || true

  unity-world-primary:
    name: Unity World dual-mode
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libudev-dev libasound2-dev

      # Phase 13: default includes unity-world-primary — "on" is the default build.
      - name: engine-core lib tests (default / feature on)
        run: cargo test -p engine-core --lib

      - name: engine-core lifecycle tests (default / feature on)
        run: cargo test -p engine-core --test unity_lifecycle_tests

      # Opt-out path: must disable default features (bare cargo test is NOT feature-off).
      - name: engine-core lib tests (feature off / array authority)
        run: cargo test -p engine-core --lib --no-default-features --features audio

      - name: engine-core lifecycle tests (feature off / array authority)
        run: cargo test -p engine-core --test unity_lifecycle_tests --no-default-features --features audio

  wasm:
    name: WASM Build
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Build engine-render for WASM
        run: cargo build -p engine-render --target wasm32-unknown-unknown

      - name: Build engine-editor lib for WASM
        run: cargo build -p engine-editor --target wasm32-unknown-unknown --no-default-features --lib

  integration:
    name: Integration Tests
    needs: [build-and-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libudev-dev libasound2-dev

      - name: Run integration tests
        run: cargo test --test integration_tests
